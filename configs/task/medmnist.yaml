name: classification

data:
  data_root: data/medmnist
  dataset: medmnist
  batch_size: 8
  num_workers: 24

# model for data
model:
  _target_: models.resnet.ResNet18
  num_classes: 11
  input_channel: 1

# optimizer for training task model
optimizer:
  _target_: torch.optim.SGD
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0005

# lr scheduler for training task optimizer
#lr_scheduler:
#  _target_: torch.optim.lr_scheduler.MultiStepLR
#  milestones: [30, 60, 90, 100]
#  gamma: 0.2

lr_scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 200

epoch: 200
save_num_model: 200

# ResNet18
train_layer: ['layer4.1.bn1.weight', 'layer4.1.bn1.bias', 'layer4.1.bn2.bias', 'layer4.1.bn2.weight']

# ResNet34
#train_layer: ['layer4.2.bn1.weight', 'layer4.2.bn1.bias', 'layer4.2.bn2.bias', 'layer4.2.bn2.weight']

# ResNet50
#train_layer: ['layer4.2.bn1.weight', 'layer4.2.bn1.bias', 
#              'layer4.2.bn2.bias',   'layer4.2.bn2.weight',
#              'layer4.2.bn3.weight', 'layer4.2.bn3.bias']


#train_layer: ['layer4.1.batch_norm1.weight','layer4.1.batch_norm1.bias',
#              'layer4.1.batch_norm2.weight','layer4.1.batch_norm2.bias', 
#              'layer4.1.batch_norm3.weight','layer4.1.batch_norm3.bias']


# parameter data root
param:
  data_root: param_data/medmnist/data.pt
  k: 200
  num_workers: 24


